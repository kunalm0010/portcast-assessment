services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  redis-replica:
    image: redis:7-alpine
    command: redis-server --replicaof redis 6379
    depends_on:
      redis:
        condition: service_healthy

  api-1:
    build: .
    environment:
      INSTANCE_NAME: api-1
      REDIS_URL: redis://redis:6379/0
      CONFIG_DIR: /app/configs
      REDIS_TIMEOUT_MS: "50"
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8000"

  api-2:
    build: .
    environment:
      INSTANCE_NAME: api-2
      REDIS_URL: redis://redis:6379/0
      CONFIG_DIR: /app/configs
      REDIS_TIMEOUT_MS: "50"
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-1
      - api-2
